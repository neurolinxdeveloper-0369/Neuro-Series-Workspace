name: Provisioning checks (no deployment)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/provisioning-checks.yml'
      - 'src/components/AddDeviceScreen.tsx'
      - 'src/services/device.ts'
      - 'server/**'
      - 'android/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm --prefix server ci
      - run: npm --prefix server test
        env:
          NEURO_TEST_DATABASE_URL: postgresql://postgres:ci-postgres@localhost:5432/postgres
