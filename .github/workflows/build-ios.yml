name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js (for React UI)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: react_ui/package-lock.json

      - name: Build React UI
        working-directory: react_ui
        run: |
          npm ci
          npm run build

      - name: Set up Java (for Android/Flutter tooling)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: mobile_shell
        run: flutter pub get

      - name: Build iOS App (Unsigned IPA)
        working-directory: mobile_shell
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../mobile_shell.ipa Payload
          cd ../../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile_shell-ios-ipa
          path: mobile_shell/mobile_shell.ipa
          retention-days: 7
