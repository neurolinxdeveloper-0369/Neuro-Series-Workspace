name: Smart Workspace CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-test:
    name: Build & Validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: "Build Frontend Application"
        run: npm run build
        env:
          NODE_ENV: production
          VITE_BASE_PATH: /neuro-series/

      - name: Install Server Dependencies
        run: npm --prefix server ci

      - name: Test server and home sharing
        run: npm --prefix server test
        env:
          NEURO_TEST_DATABASE_URL: postgresql://postgres:ci-postgres@localhost:5432/postgres

  docker-publish:
    name: Build & Push Docker Images
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Lowercase Image Name
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build and push Frontend image
      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Build and push Backend API image
      - name: Build and Push Backend API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-portainer:
    name: Trigger Portainer Redeployment
    needs: docker-publish
    runs-on: ubuntu-latest

    steps:
      - name: Call Portainer Stack Webhook
        env:
          SECRET_WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          WEBHOOK_URL="${SECRET_WEBHOOK:-https://portainer.neurolinx.in/api/stacks/webhooks/995f07b2-8d4f-4801-94f2-cde4005505ff}"
          echo "Triggering Portainer stack redeployment to VPS..."
          curl --fail --silent --show-error --max-time 30 -X POST "$WEBHOOK_URL"

      - name: Verify live API and WebSocket
        run: |
          set -euo pipefail
          base="https://neurolinx.in/neuro-series"
          api_status=unavailable
          ws_status=unavailable
          for attempt in {1..18}; do
            if health=$(curl --fail --silent --max-time 8 "$base/api/health") &&
              jq -e '.status == "healthy" and .service == "Neuro Series Smart Workspace API"' <<< "$health" >/dev/null; then
              api_status=healthy
            else
              api_status=unavailable
            fi

            # A successful upgrade can leave curl waiting for WebSocket frames.
            ws_status=$(curl --silent --http1.1 --max-time 3 --output /dev/null --write-out '%{http_code}' \
              --header 'Connection: Upgrade' --header 'Upgrade: websocket' \
              --header 'Sec-WebSocket-Version: 13' --header 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' \
              "$base/ws" || true)
            if [ "$api_status" = healthy ] && [ "$ws_status" = 101 ]; then
              echo "Live API health and WebSocket upgrade verified."
              exit 0
            fi
            if [ "$attempt" -lt 18 ]; then sleep 10; fi
          done
          echo "::error::Live route checks failed (API: $api_status, WebSocket HTTP: $ws_status)."
          exit 1
