name: Smart Workspace CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-test:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: "Build Frontend Application"
        run: npm run build
        env:
          NODE_ENV: production
          VITE_BASE_PATH: /neuro-series/

      - name: Install Server Dependencies
        run: npm --prefix server ci

      - name: "Build Server Application"
        run: npm --prefix server run build

  docker-publish:
    name: Build & Push Docker Images
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Lowercase Image Name
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build and push Frontend image
      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Build and push Backend API image
      - name: Build and Push Backend API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-portainer:
    name: Trigger Portainer Redeployment
    needs: docker-publish
    runs-on: ubuntu-latest

    steps:
      - name: Call Portainer Stack Webhook
        env:
          SECRET_WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          WEBHOOK_URL="${SECRET_WEBHOOK:-https://portainer.neurolinx.in/api/stacks/webhooks/995f07b2-8d4f-4801-94f2-cde4005505ff}"
          echo "Triggering Portainer stack redeployment..."
          curl -k -X POST "$WEBHOOK_URL" || echo "Webhook trigger completed."
