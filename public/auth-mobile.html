<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neuro Series | Google Sign-In</title>
  <style>
    body {
      background: #d4edf4;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #0369a1;
      font-weight: 600;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(2, 132, 199, 0.2);
      border-top-color: #0284c7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div>Connecting to Google...</div>
  <script>
    const CLIENT_ID = '600716895881-bjunr7bllqd3ccgmnmfmub46cfu0q8ug.apps.googleusercontent.com';
    const redirectUri = encodeURIComponent('https://neurolinx.in/neuro-series/');
    const googleAuthUrl = 'https://accounts.google.com/o/oauth2/v2/auth?client_id=' + CLIENT_ID + 
      '&redirect_uri=' + redirectUri + 
      '&response_type=token&scope=' + encodeURIComponent('openid profile email') + 
      '&prompt=select_account';
    window.location.replace(googleAuthUrl);
  </script>
</body>
</html>
