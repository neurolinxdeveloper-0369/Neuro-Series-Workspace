<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neuro Series | Google Sign-In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body {
      background: #d4edf4;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(255, 255, 255, 0.95) 0%, transparent 50%),
        radial-gradient(circle at 90% 90%, rgba(255, 255, 255, 0.90) 0%, transparent 50%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #0f172a;
    }
    .card {
      background: #ffffff;
      border-radius: 28px;
      padding: 36px 28px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.12);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .g-btn-container {
      display: flex;
      justify-content: center;
      width: 100%;
      min-height: 48px;
    }
    .loader {
      display: none;
      align-items: center;
      gap: 10px;
      color: #0284c7;
      font-size: 14px;
      font-weight: 600;
      margin-top: 16px;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(2, 132, 199, 0.2);
      border-top-color: #0284c7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .error-box {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      font-size: 13px;
      padding: 12px 16px;
      border-radius: 14px;
      margin-top: 16px;
      text-align: left;
      width: 100%;
    }
    .close-btn {
      margin-top: 24px;
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="logo_black.png" alt="Neuro Series" class="logo" />
    <h1>Sign in with Google</h1>
    <p>Complete authentication to sync and control your smart devices seamlessly.</p>

    <!-- Google Identity Services Render Target -->
    <div id="google-btn" class="g-btn-container"></div>

    <div id="loader" class="loader">
      <div class="spinner"></div>
      <span>Signing you in...</span>
    </div>

    <div id="error-box" class="error-box"></div>

    <button type="button" class="close-btn" onclick="window.close()">Cancel and return</button>
  </div>

  <script>
    const CLIENT_ID = '600716895881-bjunr7bllqd3ccgmnmfmub46cfu0q8ug.apps.googleusercontent.com';
    const API_ENDPOINT = '/neuro-series/api/auth/google';

    function showError(msg) {
      const errBox = document.getElementById('error-box');
      errBox.textContent = msg;
      errBox.style.display = 'block';
      document.getElementById('loader').style.display = 'none';
      document.getElementById('google-btn').style.display = 'flex';
    }

    function handleCredentialResponse(response) {
      if (!response.credential) {
        showError('No credential received from Google.');
        return;
      }

      document.getElementById('google-btn').style.display = 'none';
      document.getElementById('loader').style.display = 'flex';
      document.getElementById('error-box').style.display = 'none';

      fetch(API_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idToken: response.credential })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.token && data.user) {
          // Send auth payload to parent opener window
          if (window.opener) {
            window.opener.postMessage({
              type: 'NEURO_AUTH_SUCCESS',
              token: data.token,
              user: data.user
            }, '*');
            setTimeout(() => { window.close(); }, 300);
          } else {
            // Direct URL redirect fallback for in-app browser
            window.location.href = 'in.neurolinx.neuroseries://auth?token=' + encodeURIComponent(data.token);
          }
        } else {
          showError(data.error || 'Backend authentication failed.');
        }
      })
      .catch(err => {
        showError('Network error connecting to Neuro Series server.');
      });
    }

    window.onload = function () {
      let attempts = 0;
      const checkGsi = setInterval(() => {
        attempts++;
        if (window.google?.accounts?.id) {
          clearInterval(checkGsi);
          window.google.accounts.id.initialize({
            client_id: CLIENT_ID,
            callback: handleCredentialResponse,
            auto_select: false,
            cancel_on_tap_outside: true
          });

          window.google.accounts.id.renderButton(
            document.getElementById('google-btn'),
            {
              theme: 'outline',
              size: 'large',
              shape: 'pill',
              width: 320,
              text: 'continue_with'
            }
          );
        } else if (attempts > 30) {
          clearInterval(checkGsi);
          showError('Failed to load Google services. Please check your internet connection.');
        }
      }, 200);
    };
  </script>
</body>
</html>
