version: '3.8'

services:
  smart-workspace:
    container_name: smart-workspace
    image: ghcr.io/neurolinxdeveloper-0369/neuro-series-workspace:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3055:80"
    environment:
      - NODE_ENV=production
      - VITE_BASE_PATH=/neuro-series/
      - VITE_API_BASE_URL=https://api.neurolinx.in
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  smart-workspace-db:
    container_name: smart-workspace-db
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: neurolinx_smart_workspace
      POSTGRES_USER: neurolinx_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-NeuroSeriesSecure2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
